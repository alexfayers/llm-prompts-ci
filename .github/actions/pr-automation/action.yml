name: PR automation
description: Sync a public repo's PR status onto the llm-prompts ecosystem project board, enable squash auto-merge on ready contribute PRs, assign the PR author, apply a breaking label from the PR title or body, label blocked PRs, label PRs with merge conflicts or failing required checks as blocked, apply path-based area labels, report a codeowner-review commit status and request the needed owners' review, report a copilot-review commit status that waits for a requested Copilot review, and label PRs ready to auto-rebase, and rebase auto-rebase PRs onto the base branch when it moves or when the label is added.
inputs:
  automation-token:
    description: Token for enabling auto-merge, for rebasing PRs and for removing the blocked label. Unlike github.token, it makes these changes start new workflow runs. In a private repo, scope the token to that repo only.
    required: true
  projects-token:
    description: Token for the Project GraphQL status sync. In a private repo, scope the token to that repo only.
    required: true
  github-token:
    description: Token used for labeling the PR and reading repo contents.
    required: true
  project:
    description: Set to "false" to skip syncing PR status onto the project board.
    required: false
    default: 'true'
  review-owners:
    description: Extra owners a PR Copilot did not approve needs. Each line uses CODEOWNERS syntax. The last matching line wins. A pattern with no users clears the extra owners. The repo owner is always needed.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Wait for a requested Copilot review
      id: wait-copilot
      if: github.event_name == 'pull_request_target' && github.event.action == 'review_requested'
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.github-token }}
        script: |
          const { waitForReview } = require(`${process.env.ACTION_PATH}/copilot-review.js`)
          core.setOutput('reviewed', await waitForReview({ github, context }))

    - name: Codeowner review gate
      if: |
        (github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review", "converted_to_draft", "edited", "labeled", "unlabeled", "auto_merge_enabled"]'), github.event.action)) ||
        steps.wait-copilot.outputs.reviewed == 'true' ||
        (github.event_name == 'workflow_run' && contains(fromJSON('["CI", "PR review", "Copilot"]'), github.event.workflow_run.name))
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        REVIEW_OWNERS: ${{ inputs.review-owners }}
      with:
        retries: 3
        github-token: ${{ inputs.github-token }}
        script: |
          const { gate } = require(`${process.env.ACTION_PATH}/codeowner-review.js`)
          await gate({ github, context })

    - name: Copilot review gate
      if: |
        (github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review", "converted_to_draft", "edited", "labeled", "unlabeled", "review_requested", "review_request_removed", "auto_merge_enabled"]'), github.event.action)) ||
        (github.event_name == 'workflow_run' && contains(fromJSON('["PR review", "Copilot"]'), github.event.workflow_run.name))
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.github-token }}
        script: |
          const { gate } = require(`${process.env.ACTION_PATH}/copilot-review.js`)
          await gate({ github, context })

    - name: Enable squash auto-merge
      if: |
        github.event_name == 'pull_request_target' &&
        (github.event.action == 'ready_for_review' ||
        (contains(fromJSON('["opened", "reopened"]'), github.event.action) && !github.event.pull_request.draft))
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.automation-token }}
        script: |
          const { enable } = require(`${process.env.ACTION_PATH}/auto-merge.js`)
          await enable({ github, context, core })

    - name: Rebase auto-rebase PRs
      if: github.event_name == 'push'
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.automation-token }}
        script: |
          const { rebase } = require(`${process.env.ACTION_PATH}/rebase-prs.js`)
          await rebase({ github, context, core })

    - name: Assign PR author
      if: |
        github.event_name == 'pull_request_target' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.github-token }}
        script: |
          const { assign } = require(`${process.env.ACTION_PATH}/assign-author.js`)
          await assign({ github, context, core })

    - name: Label breaking PR
      if: |
        github.event_name == 'pull_request_target' &&
        contains(fromJSON('["opened", "reopened", "edited"]'), github.event.action)
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.github-token }}
        script: |
          const { label } = require(`${process.env.ACTION_PATH}/label-pr.js`)
          await label({ github, context, core })

    - name: Label blocked PR
      if: |
        (github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "converted_to_draft", "ready_for_review", "synchronize"]'), github.event.action)) ||
        (github.event_name == 'workflow_run' && github.event.action == 'completed')
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.github-token }}
        script: |
          const { labelBlocked } = require(`${process.env.ACTION_PATH}/label-pr.js`)
          await labelBlocked({ github, context, core })

    - name: Label conflicting PR
      if: |
        github.event_name == 'push' ||
        (github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "synchronize", "edited"]'), github.event.action)) ||
        (github.event_name == 'workflow_run' && contains(fromJSON('["CI", "PR template"]'), github.event.workflow_run.name))
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
        AUTOMATION_TOKEN: ${{ inputs.automation-token }}
      with:
        retries: 3
        github-token: ${{ inputs.github-token }}
        script: |
          const { labelConflicts } = require(`${process.env.ACTION_PATH}/label-conflicts.js`)
          await labelConflicts({ github, removeClient: getOctokit(process.env.AUTOMATION_TOKEN), context, core })

    - name: Hold auto-merge on a Copilot review without approval
      if: steps.wait-copilot.outputs.reviewed == 'true' || (github.event_name == 'workflow_run' && contains(fromJSON('["PR review", "Copilot"]'), github.event.workflow_run.name))
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.automation-token }}
        script: |
          const { holdAutoMerge } = require(`${process.env.ACTION_PATH}/copilot-review.js`)
          await holdAutoMerge({ github, context, core })

    - name: Sync project status
      if: |
        inputs.project == 'true' &&
        inputs.projects-token != '' &&
        !github.event.repository.private &&
        ((github.event_name == 'pull_request_target' &&
          (contains(fromJSON('["opened", "reopened", "synchronize", "closed", "ready_for_review", "converted_to_draft"]'), github.event.action) ||
          (contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) && startsWith(github.event.label.name, 'min-reviews:')))) ||
        steps.wait-copilot.outputs.reviewed == 'true' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'PR review'))
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.projects-token }}
        script: |
          const { sync } = require(`${process.env.ACTION_PATH}/sync-project-status.js`)
          await sync({ github, context, core })

    - name: Label auto-rebase PR
      id: label-auto-rebase
      if: |
        (github.event_name == 'pull_request_target' && contains(fromJSON('["opened", "reopened", "synchronize", "ready_for_review", "edited", "auto_merge_enabled"]'), github.event.action)) ||
        steps.wait-copilot.outputs.reviewed == 'true' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'PR review')
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.github-token }}
        script: |
          const { labelAutoRebase } = require(`${process.env.ACTION_PATH}/label-pr.js`)
          await labelAutoRebase({ github, context, core })

    - name: Rebase newly labelled PR
      if: steps.label-auto-rebase.outputs.labelled == 'true' || (github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'auto-rebase')
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        retries: 3
        github-token: ${{ inputs.automation-token }}
        script: |
          const { rebaseLabelled } = require(`${process.env.ACTION_PATH}/rebase-prs.js`)
          await rebaseLabelled({ github, context, core })

    - name: Label PR by area
      if: ${{ !contains(fromJSON('["push", "workflow_run"]'), github.event_name) }}
      uses: actions/labeler@v7
      with:
        repo-token: ${{ inputs.github-token }}
        sync-labels: true
