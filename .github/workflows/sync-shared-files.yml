name: Sync shared files

on:
  push:
    branches: [main]
    paths:
      - .github/instructions/review.instructions.md
      - .github/instructions/prompts.instructions.md
      - .github/instructions/python.instructions.md
      - .github/instructions/typescript.instructions.md
      - templates/release-please-config.json
      - .github/workflows/project-automation.yml
  workflow_dispatch:

concurrency:
  group: sync-shared-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo: [llm-prompts, cline-hooks, mcp-memory]
    steps:
      - uses: actions/checkout@v7
      - id: releaser
        uses: alexfayers/llm-prompts-ci/.github/actions/app-token@main
        with:
          client-id: ${{ secrets.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          fallback-token: ${{ secrets.PROJECTS_TOKEN }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.releaser.outputs.token }}
          path: target
      - run: mkdir -p target/.github/instructions target/.github/workflows
      - run: cp .github/instructions/{review,prompts,python,typescript}.instructions.md target/.github/instructions/
      - run: sed "s/__REPO__/$REPO/" templates/release-please-config.json > target/release-please-config.json
        env:
          REPO: ${{ matrix.repo }}
      - run: sed "s#uses: ./.github/workflows/pr-automation.yml#uses: $OWNER/llm-prompts-ci/.github/workflows/pr-automation.yml@main#" .github/workflows/project-automation.yml > target/.github/workflows/project-automation.yml
        env:
          OWNER: ${{ github.repository_owner }}
      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.releaser.outputs.token }}
          path: target
          branch: bot/shared-files
          delete-branch: true
          commit-message: 'chore: sync shared files from llm-prompts-ci'
          title: 'chore: sync shared files from llm-prompts-ci'
          body: |
            ## What

            - Copy the Copilot review rules from llm-prompts-ci to `.github/instructions/`.
            - Copy the release-please config from llm-prompts-ci to `release-please-config.json`.
            - Copy the project automation caller from llm-prompts-ci.

            ## Why

            - llm-prompts-ci is the one place that edits these files.
            - Copilot review, release-please and workflow triggers read this repo's own files.
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
