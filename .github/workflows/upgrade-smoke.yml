name: Upgrade smoke

on:
  workflow_call:
    inputs:
      repo:
        description: Tool under test, one of llm-prompts, cline-hooks or mcp-memory.
        required: true
        type: string

permissions: {}

concurrency:
  group: upgrade-smoke-${{ inputs.repo }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check the tool name
        env:
          REPO: ${{ inputs.repo }}
        run: |
          case "$REPO" in
            llm-prompts | cline-hooks | mcp-memory) ;;
            *) echo "::error::repo must be llm-prompts, cline-hooks or mcp-memory, not '$REPO'"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: alexfayers/llm-prompts-ci/.github/actions/setup-just@main
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install -g @anthropic-ai/claude-code@2.1.332

      - name: Check the justfile recipes
        run: |
          for recipe in upgrade-seed upgrade-smoke; do
            if ! just --show "$recipe" > /dev/null 2>&1; then
              echo "::error::The justfile has no '$recipe' recipe. Add it to run the upgrade smoke test."
              exit 1
            fi
          done

      - id: latest
        name: Find the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tool in llm-prompts cline-hooks mcp-memory; do
            echo "$tool=$(gh release view -R "alexfayers/$tool" --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
          done

      - name: Use a temporary home
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/.local/bin"
          port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          {
            echo "HOME=$home"
            echo "XDG_CONFIG_HOME=$home/.config"
            echo "XDG_DATA_HOME=$home/.local/share"
            echo "XDG_STATE_HOME=$home/.local/state"
            echo "XDG_CACHE_HOME=$home/.cache"
            echo "XDG_BIN_HOME=$home/.local/bin"
            echo "LLM_PROMPTS_HOME=$home/.local/share/llm-prompts"
            echo "MCP_MEMORY_PORT=$port"
          } >> "$GITHUB_ENV"
          echo "$home/.local/bin" >> "$GITHUB_PATH"

      # shortcut: shims block mcp-memory setup-service, replace with MCP_MEMORY_NO_SERVICE=1 once mcp-memory#260 is in the latest release
      - name: Block system service commands
        run: |
          shims="$RUNNER_TEMP/no-services"
          mkdir -p "$shims"
          for command in sudo systemctl launchctl; do
            printf '#!/bin/sh\necho "upgrade-smoke: %s is blocked so the job leaves system services alone" >&2\nexit 1\n' "$command" > "$shims/$command"
            chmod +x "$shims/$command"
          done
          echo "$shims" >> "$GITHUB_PATH"

      - name: Install the latest releases
        env:
          TAG: ${{ steps.latest.outputs.llm-prompts }}
        run: |
          echo "llm-prompts $TAG"
          uvx --from "git+https://github.com/alexfayers/llm-prompts@$TAG" llm-prompts setup --init
          uvx --from "git+https://github.com/alexfayers/llm-prompts@$TAG" llm-prompts setup
          llm-prompts install claude-code

      - name: Check the tools are at their latest releases
        env:
          LATEST: ${{ toJSON(steps.latest.outputs) }}
        run: |
          python="$(uv tool dir)/llm-prompts/bin/python"
          for tool in llm-prompts cline-hooks mcp-memory; do
            tag="$(jq -r --arg tool "$tool" '.[$tool]' <<< "$LATEST")"
            version="$("$python" -c 'import sys; from importlib.metadata import version; print(version(sys.argv[1]))' "$tool")"
            echo "$tool: installed $version, latest release $tag"
            if [ "v$version" != "$tag" ]; then
              echo "::error::$tool is installed at $version, not its latest release $tag"
              exit 1
            fi
          done

      - name: Check the memory server is registered
        run: |
          jq -e --arg url "http://localhost:$MCP_MEMORY_PORT/mcp" \
            '.mcpServers.memory.url == $url' "$HOME/.claude.json"

      - name: Start the memory server
        run: |
          cat > "$RUNNER_TEMP/start-memory.sh" <<'SH'
          pidfile="$RUNNER_TEMP/mcp-memory.pid"
          if [ -f "$pidfile" ]; then
            pid="$(cat "$pidfile")"
            kill "$pid"
            while kill -0 "$pid" 2> /dev/null; do sleep 1; done
          fi
          nohup mcp-memory >> "$RUNNER_TEMP/mcp-memory.log" 2>&1 < /dev/null &
          echo "$!" > "$pidfile"
          if ! curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            -X POST -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:$MCP_MEMORY_PORT/mcp"; then
            cat "$RUNNER_TEMP/mcp-memory.log"
            exit 1
          fi
          SH
          sh "$RUNNER_TEMP/start-memory.sh"

      - run: just upgrade-seed

      - name: Point the tool at the PR head
        env:
          REPO: ${{ inputs.repo }}
        run: |
          uv run --isolated --no-project --with tomlkit python - <<'PY'
          import os
          from pathlib import Path

          import tomlkit

          repo, ref = os.environ["REPO"], os.environ["HEAD_SHA"]
          path = Path(os.environ["LLM_PROMPTS_HOME"]) / "llm-prompts" / "config" / "config.toml"
          doc = tomlkit.parse(path.read_text(encoding="utf-8"))
          tool = next((t for t in doc["tools"] if t["name"] == repo), None)
          if tool is None:
              raise SystemExit(f"No [[tools]] entry named {repo} in {path}")
          tool["source"] = f"git+https://github.com/alexfayers/{repo}.git"
          tool["ref"] = ref
          path.write_text(tomlkit.dumps(doc), encoding="utf-8")
          print(f"{repo}: ref = {ref}")
          PY

      - run: llm-prompts update
      - name: Restart the memory server
        run: sh "$RUNNER_TEMP/start-memory.sh"
      - run: just upgrade-smoke
      - name: Update again
        run: llm-prompts update
      - name: Check the cline-hooks hooks still run
        if: inputs.repo != 'cline-hooks'
        run: |
          export CLINE_HOOKS_DATA_DIR="$RUNNER_TEMP/cline-hooks-check"
          out="$(cline-hook plugins 2>&1)" || { printf '%s\n' "$out"; echo '::error::cline-hook plugins failed'; exit 1; }
          grep -q 'check_pending: clean' <<< "$out" || { printf '%s\n' "$out"; echo '::error::cline-hook plugins failed'; exit 1; }
          payload="$(jq -cn --arg cwd "$PWD" '{session_id: "upgrade-smoke", transcript_path: "", cwd: $cwd, hook_event_name: "PreToolUse", tool_name: "Read", tool_input: {file_path: ($cwd + "/README.md")}}')"
          commands="$(jq -r '[.hooks[]?[]?.hooks[]? | select(.type == "command") | .command | select(test("cline-hook"))] | unique[]' "$HOME/.claude/settings.json")"
          [ -n "$commands" ] || { echo '::error::~/.claude/settings.json has no cline-hook commands'; exit 1; }
          while IFS= read -r command; do
            output="$(printf '%s\n' "$payload" | sh -c "$command" 2>&1)" || { printf '%s\n' "$output"; echo "::error::hook command failed: $command"; exit 1; }
          done <<< "$commands"
          log="$CLINE_HOOKS_DATA_DIR/cline-hooks.log"
          [ -f "$log" ] || { echo "::error::$log is missing"; exit 1; }
          if grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8} (ERROR|CRITICAL) ' "$log"; then
            echo '::error::cline-hooks logged errors'
            exit 1
          fi
