name: Probe needs inner

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - id: check
        run: |
          test "$MODE" != fail
          echo "blocked=$([ "$MODE" = blocked ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          MODE: ${{ inputs.mode }}

  gate:
    needs: check
    if: needs.check.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
