name: PR template

on:
  workflow_call:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, synchronize]

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-template-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: alexfayers/llm-prompts-ci/.github/actions/pr-template@main
