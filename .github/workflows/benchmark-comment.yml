name: Benchmark comment

on:
  workflow_call:

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: alexfayers/llm-prompts-ci
          ref: main
          path: .shared-automation
      - id: download
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: benchmark-report
          path: benchmark-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { reportForRun } = require('./.shared-automation/.github/scripts/benchmark-comment.js')
            await reportForRun({ github, context, core, dir: 'benchmark-artifact' })
