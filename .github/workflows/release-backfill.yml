name: Release backfill

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository to backfill
        required: true
        type: choice
        options: [llm-prompts, cline-hooks, mcp-memory]
      dry-run:
        description: Only log the releases that would be created
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ inputs.repo }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - id: releaser
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ secrets.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repo }}
      - if: steps.releaser.outputs.token == ''
        run: echo "::error::GitHub App token was not minted" && exit 1
      - uses: actions/github-script@v9
        env:
          REPO: ${{ inputs.repo }}
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          github-token: ${{ steps.releaser.outputs.token }}
          script: |
            const { backfill } = require('./.github/scripts/release-backfill.js')
            await backfill({ github, core, owner: context.repo.owner, repo: process.env.REPO, dryRun: process.env.DRY_RUN === 'true' })
