name: Probe needs

on:
  push:
    branches: [alexfayers/probe-reusable-needs]

permissions: {}

jobs:
  inner-open:
    uses: ./.github/workflows/probe-needs-inner.yml
    with:
      mode: open

  after-open:
    needs: inner-open
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  inner-blocked:
    uses: ./.github/workflows/probe-needs-inner.yml
    with:
      mode: blocked

  after-blocked:
    needs: inner-blocked
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  inner-fail:
    uses: ./.github/workflows/probe-needs-inner.yml
    with:
      mode: fail

  after-fail:
    needs: inner-fail
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
