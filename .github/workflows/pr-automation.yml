name: PR automation

on:
  workflow_call:
    inputs:
      project:
        description: Set to false to skip syncing PR status onto the project board.
        required: false
        type: boolean
        default: true
      review-owners:
        description: Extra owners a PR Copilot did not approve needs. Each line uses CODEOWNERS syntax. The last matching line wins. A pattern with no users clears the extra owners. The repo owner is always needed. Defaults to the prompt owners for shared prompt rules, skills, workflows and agents.
        required: false
        type: string
        default: |
          /src/*/prompts/**/rules/ @codebeetl @unkokaeru
          /src/*/prompts/**/skills/ @codebeetl @unkokaeru
          /src/*/prompts/**/workflows/ @codebeetl @unkokaeru
          /src/*/prompts/**/agents/ @codebeetl @unkokaeru
          /src/*/prompts/pi/
          /src/*/prompts/**/rules/hooks*.md
    secrets:
      CI_BOT_CLIENT_ID:
        required: false
      CI_BOT_PRIVATE_KEY:
        required: false
      PROJECTS_TOKEN:
        required: true

jobs:
  automate:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    steps:
      - id: ci-bot
        uses: alexfayers/llm-prompts-ci/.github/actions/app-token@main
        with:
          client-id: ${{ secrets.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          fallback-token: ${{ secrets.PROJECTS_TOKEN }}
      - uses: alexfayers/llm-prompts-ci/.github/actions/pr-automation@main
        with:
          automation-token: ${{ steps.ci-bot.outputs.token }}
          projects-token: ${{ secrets.PROJECTS_TOKEN }}
          github-token: ${{ github.token }}
          project: ${{ inputs.project }}
          review-owners: ${{ inputs.review-owners }}
